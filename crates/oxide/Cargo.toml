[package]
name = "oxide"
version = "0.1.0"
edition = "2024"
description = "A tiny, fast, local Twitch chat bot written in Rust."
license = "MIT"
publish = false

[[bin]]
name = "oxide"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "linux-native-async-persistent"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
